name: NLL consistency tests

# The NLL consistency tests (ctest label NLLConsistency) are slow, so they are
# excluded from the regular CI and only run for PRs with the testNLL label.

on:
  workflow_dispatch:
  pull_request:
    # 'labeled' so that adding the testNLL label starts the tests
    types: [opened, synchronize, reopened, labeled]

jobs:
  nll_consistency:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'testNLL') &&
       (github.event.action != 'labeled' || github.event.label.name == 'testNLL'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Same LCG builds as in cvmfs-ci.yml. The CMSSW builds there only build
        # the standalone tests, which don't include the NLL consistency tests.
        include:
          - LCG_RELEASE: "LCG_108"
            LCG_ARCH: "x86_64-ubuntu2404-gcc13-opt"
            ROOT: "6.36.02"
          - LCG_RELEASE: "LCG_110"
            LCG_ARCH: "x86_64-ubuntu2404-gcc13-opt"
            ROOT: "6.40.02"
          - LCG_RELEASE: "dev3/latest"
            LCG_ARCH: "x86_64-ubuntu2404-gcc13-opt"
            ROOT: "LCG master"
    name: NLL consistency ${{ matrix.LCG_RELEASE }} - ROOT ${{ matrix.ROOT }}
    env:
      LCG_RELEASE: ${{ matrix.LCG_RELEASE }}
      LCG_ARCH: ${{ matrix.LCG_ARCH }}
    steps:
      - uses: actions/checkout@v7

      - uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: 'sft.cern.ch'

      - name: Setup compiler
        run: |
          echo "CC=$(which gcc)" >> $GITHUB_ENV
          echo "CXX=$(which g++)" >> $GITHUB_ENV

      - name: Build Combine (LCG)
        env:
          # VDT doesn't seem to be available in dev3/latest.
          USE_VDT: ${{ matrix.LCG_RELEASE != 'dev3/latest' && 'TRUE' || 'FALSE' }}
        run: >-
          source /cvmfs/sft.cern.ch/lcg/views/${LCG_RELEASE}/${LCG_ARCH}/setup.sh;
          root --version;
          mkdir build;
          cd build;
          cmake -DCMAKE_INSTALL_PREFIX=../install \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DUSE_VDT=${USE_VDT} \
                -DBUILD_TESTS=TRUE \
                ..;
          make install -j$(nproc);
          echo "RooFit.Banner: 0" > .rootrc;
          echo "RooFit.Banner: 0" > test/.rootrc;

      - name: Run NLL consistency tests
        run: >-
          source /cvmfs/sft.cern.ch/lcg/views/${LCG_RELEASE}/${LCG_ARCH}/setup.sh;
          ulimit -s unlimited;
          ctest --test-dir build/test --output-on-failure -j$(nproc) -L NLLConsistency;
