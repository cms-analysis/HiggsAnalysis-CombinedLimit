name: clang-format

on:
  pull_request:
    paths:
      - '**.h'
      - '**.cc'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  precheckin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Run git-clang-format
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
          PR_BASE=$(git merge-base ${{ github.event.pull_request.head.sha }} origin/${{ github.event.pull_request.base.ref }})
          echo "running git clang-format against $PR_BASE commit"
          git \
          -c color.ui=always \
          -c diff.wsErrorHighlight=all \
          -c color.diff.whitespace='red reverse' \
          clang-format-18 --diff --binary clang-format-18 --commit $PR_BASE -- src/ || \
          (printf '%b\n' "Please run the following git-clang-format locally to fix the formatting:\n
                git-clang-format HEAD~\n
                for multiple commits we should place the formatting changes in the related commit with:\n
                \t\tgit rebase -i -x \"git-clang-format-18 main && git commit -a --allow-empty --fixup=HEAD\" --strategy-option=theirs origin/main\n
                \t\tThen inspect the results with: git log --oneline\n
                \t\tThen squash without polluting the history with: git rebase --autosquash -i main\n" && exit 1)
