name: CVMFS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**CMakeLists.txt'
      - '**.cmake'
      - '**.h'
      - '**.cc'
      - '**.cxx'
      - '**.py'
      - '**.yml'
      - '**/BuildFile.xml'
  push:
    branches:
      - main
jobs:
  test_workflow:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMAGE: "cmscloud/al9-cms"
            CMSSW_VERSION: "CMSSW_14_1_0_pre4"
            SCRAM_ARCH: "el9_amd64_gcc12"
            ROOT: "6.30.07"
          - IMAGE: "cmscloud/cc7-cms"
            CMSSW_VERSION: "CMSSW_11_3_4"
            SCRAM_ARCH: "slc7_amd64_gcc900"
            ROOT: "6.22.09"
          - IMAGE: "cmscloud/al9-cms"
            CMSSW_VERSION: "CMSSW_14_0_0_pre1"
            SCRAM_ARCH: "el9_amd64_gcc12"
            ROOT: "6.26.11"
          - IMAGE: "cmscloud/al9-cms"
            CMSSW_VERSION: "CMSSW_16_0_0"
            SCRAM_ARCH: "el9_amd64_gcc13"
            ROOT: "6.36.07"
          - LCG_RELEASE: "LCG_108"
            LCG_ARCH: "x86_64-ubuntu2404-gcc13-opt"
            ROOT: "6.36.02"
            coverage: true
            # Regular expression for tests that are not run with this release
            CTEST_EXCLUDE: "cmshistsum_vs_cmshistfunc_fitdiagnostics"
          - LCG_RELEASE: "LCG_110"
            LCG_ARCH: "x86_64-ubuntu2404-gcc13-opt"
            ROOT: "6.40.02"
          - LCG_RELEASE: "dev3/latest"
            LCG_ARCH: "x86_64-ubuntu2404-gcc13-opt"
            ROOT: "LCG master"
    name: ${{ matrix.CMSSW_VERSION }}${{ matrix.LCG_RELEASE }} - ROOT ${{ matrix.ROOT }}
    env:
      CMSSW_VERSION: ${{ matrix.CMSSW_VERSION }}
      IMAGE: ${{ matrix.IMAGE }}
      LCG_RELEASE: ${{ matrix.LCG_RELEASE }}
      LCG_ARCH: ${{ matrix.LCG_ARCH }}
    steps:
      - uses: actions/checkout@v7

      # Reuse the CVMFS cache of previous runs. With an empty cache, the first
      # processes that search the whole LCG view (Python's sys.path, cling's
      # library lookup) fetch hundreds of nested catalogs one after another,
      # which makes the first tests slow and prone to timeouts.
      # The cache lives outside /home/runner, which the cvmfs user cannot enter.
      - name: Create CVMFS cache directory (LCG)
        if: ${{ env.CMSSW_VERSION == '' }}
        run: |
          sudo mkdir -p /mnt/cvmfs-cache
          sudo chown $(id -u):$(id -g) /mnt/cvmfs-cache

      - name: Restore CVMFS cache (LCG)
        if: ${{ env.CMSSW_VERSION == '' }}
        uses: actions/cache/restore@v6
        with:
          path: /mnt/cvmfs-cache
          key: cvmfs-cache-v2-${{ matrix.LCG_RELEASE }}-${{ matrix.LCG_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cvmfs-cache-v2-${{ matrix.LCG_RELEASE }}-${{ matrix.LCG_ARCH }}-

      - uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: ${{ (env.CMSSW_VERSION != '') && 'cms.cern.ch' || 'sft.cern.ch' }}
          cvmfs_cache_base: ${{ (env.CMSSW_VERSION == '') && '/mnt/cvmfs-cache' || '' }}

      - name: Hand CVMFS cache to the cvmfs user (LCG)
        if: ${{ env.CMSSW_VERSION == '' }}
        run: |
          sudo chown -R cvmfs:cvmfs /mnt/cvmfs-cache
          sudo du -sh /mnt/cvmfs-cache
          cvmfs_config probe sft.cern.ch

      - name: Setup compiler
        run: |
          echo "CC=$(which gcc)" >> $GITHUB_ENV
          echo "CXX=$(which g++)" >> $GITHUB_ENV

      - name: Setup code coverage
        if: ${{ (matrix.coverage == true) }}
        run: |
          sudo apt install -y lcov
          # Workaround ubuntu lcov-1.15-1 package bug
          if sudo apt list lcov --installed | grep "1.15-1" ; then
            wget https://launchpad.net/ubuntu/+source/lcov/1.15-2/+build/23784466/+files/lcov_1.15-2_all.deb
            sudo apt install -y ./lcov_1.15-2_all.deb
          fi
          echo "COMBINE_CODE_COVERAGE=1" >> $GITHUB_ENV
          echo "BUILD_TYPE=Debug" >> $GITHUB_ENV

      - name: Build Combine (LCG)
        if: ${{ env.CMSSW_VERSION == '' }}
        env:
          LCG_RELEASE: ${{ matrix.LCG_RELEASE }}
          LCG_ARCH: ${{ matrix.LCG_ARCH }}
          # VDT doesn't seem to be available in dev3/latest.
          # But also it's very good to also test builds with USE_VDT=OFF.
          USE_VDT: ${{ matrix.LCG_RELEASE != 'dev3/latest' && 'TRUE' || 'FALSE' }}
        run: >-
          source /cvmfs/sft.cern.ch/lcg/views/${LCG_RELEASE}/${LCG_ARCH}/setup.sh;
          root --version;
          mkdir build;
          cd build;
          cmake -DCMAKE_INSTALL_PREFIX=../install \
                -DCMAKE_BUILD_TYPE=$([[ -z "$BUILD_TYPE" ]] && echo RelWithDebInfo || echo $BUILD_TYPE) \
                -DCOMBINE_CODE_COVERAGE=${{ env.COMBINE_CODE_COVERAGE }} \
                -DUSE_VDT=${USE_VDT} \
                -DBUILD_TESTS=TRUE \
                ..;
          make install -j$(nproc);
          echo "RooFit.Banner: 0" > .rootrc;
          echo "RooFit.Banner: 0" > test/.rootrc;
          cd ..;
          export PATH=$PWD/install/bin:$PATH;
          export LD_LIBRARY_PATH=$PWD/install/lib:$LD_LIBRARY_PATH;

      - uses: rhaschke/docker-run-action@v5
        name: Build Combine (CMSSW)
        # Only run the CMSSW build step if the CMSSW_VERSION is defined. Otherwise we build for LCG.
        if: ${{ env.CMSSW_VERSION != '' }}
        with:
          image: ${{ matrix.IMAGE }}
          shell: bash
          options: -v /cvmfs:/cvmfs:shared -v ${{ github.workspace }}:/work/CombinedLimit  --mount source=cmsusr,destination=/home/cmsusr -w /home/cmsusr -e CMSSW_VERSION=${{ matrix.CMSSW_VERSION }} -e SCRAM_ARCH=${{ matrix.SCRAM_ARCH }}
          run: |
            set -e
            cd /home/cmsusr/
            source /cvmfs/cms.cern.ch/cmsset_default.sh
            scram project ${CMSSW_VERSION}
            cd ${CMSSW_VERSION}/src
            cmsenv
            mkdir -p HiggsAnalysis
            cp -r /work/CombinedLimit HiggsAnalysis/
            scramv1 b -j$(nproc --ignore=2)
            echo ${PATH}
            root --version
            combine --help

      - name: Run Tests (LCG)
        if: ${{ env.CMSSW_VERSION == '' }}
        env:
          LCG_RELEASE: ${{ matrix.LCG_RELEASE }}
          LCG_ARCH: ${{ matrix.LCG_ARCH }}
          CTEST_EXCLUDE: ${{ matrix.CTEST_EXCLUDE }}
        run: >-
          source /cvmfs/sft.cern.ch/lcg/views/${LCG_RELEASE}/${LCG_ARCH}/setup.sh;
          ulimit -s unlimited;
          ctest --test-dir build/test --output-on-failure -j$(nproc) ${CTEST_EXCLUDE:+-E "$CTEST_EXCLUDE"};

      # AlmaLinux 9 job
      - uses: ./.github/actions/run-in-cvmfs
        name: Run Tests (CMSSW, AlmaLinux 9)
        if: ${{ matrix.IMAGE == 'cmscloud/al9-cms' }}
        with:
          script: |
            set -euxo pipefail
            mkdir build_test
            cd build_test
            cmake ../test
            cmake --build . -j"$(nproc)"
            cd ..
            ctest --test-dir build_test --output-on-failure

      # CentOS 7 job
      - uses: ./.github/actions/run-in-cvmfs
        name: Run Tests (CMSSW, CentOS 7)
        if: ${{ matrix.IMAGE == 'cmscloud/cc7-cms' }}
        with:
          script: |
            set -euxo pipefail
            sudo yum install -y epel-release
            sudo yum install -y cmake3
            mkdir build_test
            cd build_test
            cmake3 ../test
            cmake3 --build . -j"$(nproc)"
            cd ..
            cd build_test
            ctest3 --output-on-failure .

      - name: Prepare code coverage report
        if: ${{ success() && (matrix.coverage == true) }}
        run: |
          # Create lcov report
          # capture coverage info
          # lcov 2.x (Ubuntu 24.04) turns gcov end-line mismatches for gtest TEST()
          # bodies and unused remove patterns into hard errors, so demote them.
          lcov --directory . --capture --output-file coverage.info --gcov-tool $CONDA_PREFIX/bin/gcov --ignore-errors gcov,mismatch,inconsistent
          # filter out system and extra files.
          # To also not include test code in coverage add them with full path to the patterns: '*/ci/*'
          lcov --remove coverage.info \
            '/usr/*' \
            "${HOME}/.cache/*" \
            '*/ci/*' \
            --ignore-errors unused \
            --output-file coverage.info
          # output coverage data for debugging (optional)
          lcov --list coverage.info

      - name: Upload to codecov.io
        if: ${{ success() && (matrix.coverage == true) }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.info
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Prepare CVMFS cache for saving (LCG)
        if: ${{ always() && env.CMSSW_VERSION == '' }}
        run: |
          cvmfs_config stat sft.cern.ch sft-nightlies.cern.ch || true
          sudo cvmfs_config umount || echo "::warning::cvmfs_config umount failed, saving the cache anyway"
          sudo chown -R $(id -u):$(id -g) /mnt/cvmfs-cache
          du -sh /mnt/cvmfs-cache

      - name: Save CVMFS cache (LCG)
        if: ${{ always() && env.CMSSW_VERSION == '' }}
        uses: actions/cache/save@v6
        with:
          path: /mnt/cvmfs-cache
          key: cvmfs-cache-v2-${{ matrix.LCG_RELEASE }}-${{ matrix.LCG_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
